spring:
  application:
    name: Turnero API

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

google:
    auth:
      client-id: ${GOOGLE_CLIENT_ID:}

auth:
    session:
      cookie-name: turnero_session
      ttl-days: 7
      secure: ${AUTH_SESSION_SECURE:false}
      same-site: Lax