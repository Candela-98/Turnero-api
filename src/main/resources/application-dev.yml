spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:turnero_dev}
    username: ${DB_USERNAME:turnero}
    password: ${DB_PASSWORD:turnero}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations:
        - classpath:db/migration
        - classpath:db/seed/local

  management:
    endpoints:
      web:
        exposure:
          include: health
    endpoint:
      health:
        show-details: always