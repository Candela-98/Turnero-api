spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations:
      - classpath:db/migration

  management:
    endpoints:
      web:
        exposure:
          include: health
    endpoint:
      health:
        show-details: never

auth:
  session:
    cookie-name: ${AUTH_SESSION_COOKIE_NAME:__Host-turnero_session}
    secure: ${AUTH_SESSION_SECURE:true}
    same-site: ${AUTH_SESSION_SAME_SITE:Lax}
